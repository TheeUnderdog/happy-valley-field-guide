name: Build site

on:
  pull_request:
    branches:
      - main
    paths:
      - "content/**"
      - "scripts/**"
      - "taxonomy/**"
      - "README.md"
      - ".github/workflows/build-site.yml"
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "scripts/**"
      - "taxonomy/**"
      - "README.md"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate static site
        run: python scripts/generate-html.py
      - name: Validate generated site on pull requests
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- index.html site/index.html; then
            echo "::error::Generated HTML is out of date. Run python scripts/generate-html.py and commit index.html and site/index.html."
            git diff -- index.html site/index.html
            exit 1
          fi
      - name: Commit generated site
        if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet -- index.html site/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html site/index.html
            git commit -m "Regenerate site"
            git push
          fi
