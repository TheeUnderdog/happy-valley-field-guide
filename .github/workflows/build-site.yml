name: Build site

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "scripts/**"
      - "taxonomy/**"
      - "README.md"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate static site
        run: python scripts/generate-html.py
      - name: Commit generated site
        run: |
          if ! git diff --quiet -- index.html site/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html site/index.html
            git commit -m "Regenerate site"
            git push
          fi
